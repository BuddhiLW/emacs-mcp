name: release

# Publish the exact VERSION reviewed in the merged PR.  The default branch
# requires PRs and verified signatures, so release CI must never create and
# push an unsigned version-bump commit of its own.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'VERSION'
  # A change to this file alone must not fire a release: VERSION is already
  # published, so the run could only end red. Re-run a release by hand instead.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: '1.12.5.1664'

      # Gate BEFORE the deploy, as every other hive repo does: a published
      # pom is immutable on Clojars, so a red suite must never be able to
      # ship a version that cannot be withdrawn.
      - name: Test
        run: clojure -M:test-unit

      # A published coordinate is immutable, so a version already on Clojars
      # makes Deploy a no-op rather than a 403. The tag step below still says
      # whether this commit is the one that shipped it.
      - name: Already on Clojars?
        id: published
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          if curl -fsS -o /dev/null "https://repo.clojars.org/io/github/hive-agi/hive-mcp/$VER/hive-mcp-$VER.pom"; then
            echo "hive-mcp $VER is already on Clojars; Deploy is skipped."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.published.outputs.published != 'true'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy

      - name: Tag published version
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          git fetch --tags
          if git rev-parse --verify "refs/tags/v$VER" >/dev/null 2>&1; then
            TAGGED=$(git rev-list -n 1 "v$VER")
            if [ "$TAGGED" = "$GITHUB_SHA" ]; then
              echo "v$VER already points at this commit — nothing to do."
              exit 0
            fi
            echo "::error::VERSION is still $VER, but v$VER points at $TAGGED,"
            echo "::error::not at this commit. Source landed on main without a"
            echo "::error::version bump, so Deploy was a no-op against an"
            echo "::error::immutable coordinate and these changes are NOT"
            echo "::error::published. Bump VERSION in a PR to release them."
            exit 1
          fi
          git tag "v$VER" "$GITHUB_SHA"
          git push origin "refs/tags/v$VER"

      # The Releases page lists Release objects, not tags. The body is this
      # version's CHANGELOG section; GitHub appends its generated notes.
      - name: Release notes from the changelog
        id: notes
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md \
            > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG section for $VER; see the generated notes below." \
              > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.notes.outputs.version }}
          name: v${{ steps.notes.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
