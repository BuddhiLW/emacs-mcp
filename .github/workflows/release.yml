name: release

# Publish the exact VERSION reviewed in the merged PR.  The default branch
# requires PRs and verified signatures, so release CI must never create and
# push an unsigned version-bump commit of its own.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'VERSION'
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - name: Deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy

      - name: Tag published version
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          git fetch --tags
          if git rev-parse --verify "refs/tags/v$VER" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VER")" = "$GITHUB_SHA"
          else
            git tag "v$VER" "$GITHUB_SHA"
            git push origin "refs/tags/v$VER"
          fi
