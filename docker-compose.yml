# hive-mcp Docker Compose
#
# QUICK START (Chroma + LSP sidecar + NATS):
#   docker compose up -d
#
# WITH TELEMETRY (+ Prometheus + Grafana + Loki):
#   docker compose --profile telemetry up -d

services:
  # =============================================================================
  # Core: Chroma Vector Database (default, always starts)
  # =============================================================================
  chroma:
    image: chromadb/chroma:latest
    container_name: hive-mcp-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    # Health check disabled - chromadb/chroma:latest lacks curl/wget/python
    # Monitor via: curl http://localhost:8000/api/v2/heartbeat
    # Or via nREPL: (chroma/embedding-configured?)

  # =============================================================================
  # Core: clojure-lsp Sidecar (default, always starts)
  # Periodic analysis dumper for hive-mcp code intelligence
  # =============================================================================
  lsp-sidecar:
    build:
      context: ./docker/lsp-sidecar
    container_name: hive-mcp-lsp-sidecar
    # Workspace mount is configurable so the sidecar can index any project
    # under a single host root, not just hive-mcp.
    #
    # HIVE_LSP_WORKSPACE_ROOT (host path) — defaults to ${HOME}/PP so that
    # both hive/* subprojects and sibling repos (e.g. PP/sec/<project>) are
    # visible. Project-ids on the MCP side are paths relative to this root
    # (e.g. "hive/hive-mcp", "sec/hexstrike-ai/labs/.../probe").
    #
    # To override:  export HIVE_LSP_WORKSPACE_ROOT=/some/host/path
    #               docker compose up -d --force-recreate lsp-sidecar
    volumes:
      - ${HOME}/.cache/hive-lsp:/cache
      - ${HIVE_LSP_WORKSPACE_ROOT:-${HOME}/PP}:/workspace:rw
      # SSH auth for private :git/url deps in deps.edn (e.g. baston/domain-spec).
      # SSH_AUTH_SOCK forwards the host ssh-agent — preferred (key never enters the container).
      # Read-only ~/.ssh mount is the fallback for `known_hosts` + ed25519 keys when the agent
      # isn't running. .gitconfig forwards user config (insteadOf rewrites, signing prefs).
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      # Share host's git/maven caches so the sidecar reuses already-fetched
      # :git/url deps (gitlibs) and Maven artifacts. Without these, every scan
      # of a project with many transitive deps re-clones from scratch and
      # trips the sidecar timeout (hit 2026-05-13 on PP/general/examples).
      - ${HOME}/.gitlibs:/root/.gitlibs:rw
      - ${HOME}/.m2:/root/.m2:rw
    environment:
      - ANALYSIS_INTERVAL_SECONDS=300
      - JAVA_OPTS=-Xmx1g -Xms256m
      - SSH_AUTH_SOCK=/ssh-agent
      # Carto requests exact projects through the shared cache inbox. Keep the
      # expensive whole-${HOME}/PP sweep off by default; opt in explicitly for
      # legacy periodic discovery.
      - LSP_AUTO_DISCOVER=${LSP_AUTO_DISCOVER:-false}
      # Analyze independent on-demand projects concurrently. Each clojure-lsp
      # process is capped by JAVA_OPTS, so tune this with available RAM/CPU.
      - LSP_WORKER_COUNT=${LSP_WORKER_COUNT:-2}
      - LSP_PROJECT_TIMEOUT_SECONDS=${LSP_PROJECT_TIMEOUT_SECONDS:-300}
      # LSP_PROJECTS applies only when LSP_AUTO_DISCOVER=true. Set it to a
      # comma-separated list to avoid discovering the entire workspace.
      - LSP_PROJECTS=${LSP_PROJECTS:-}
    # Docker's embedded resolver currently forwards to a broken host resolver
    # on this workstation. This default is known-good and remains overridable.
    dns:
      - ${HIVE_LSP_DNS:-1.1.1.1}
    restart: unless-stopped

  # =============================================================================
  # Optional: Milvus Vector Database (profile: milvus)
  # Alternative to Chroma for larger deployments
  # Uncomment to enable. Requires: docker compose --profile milvus up -d
  # =============================================================================
  # etcd:
  #   profiles: ["milvus"]
  #   container_name: hive-mcp-milvus-etcd
  #   image: quay.io/coreos/etcd:v3.5.5
  #   environment:
  #     - ETCD_AUTO_COMPACTION_MODE=revision
  #     - ETCD_AUTO_COMPACTION_RETENTION=1000
  #     - ETCD_QUOTA_BACKEND_BYTES=4294967296
  #     - ETCD_SNAPSHOT_COUNT=50000
  #   volumes:
  #     - milvus-etcd:/etcd
  #   command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
  #   healthcheck:
  #     test: ["CMD", "etcdctl", "endpoint", "health"]
  #     interval: 30s
  #     timeout: 20s
  #     retries: 3
  #   restart: unless-stopped
  #
  # minio:
  #   profiles: ["milvus"]
  #   container_name: hive-mcp-milvus-minio
  #   image: minio/minio:latest
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9001:9001"
  #     - "9000:9000"
  #   volumes:
  #     - milvus-minio:/minio_data
  #   command: minio server /minio_data --console-address ":9001"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 20s
  #     retries: 3
  #   restart: unless-stopped
  #
  # milvus:
  #   profiles: ["milvus"]
  #   container_name: hive-mcp-milvus
  #   image: milvusdb/milvus:v2.4.4
  #   command: ["milvus", "run", "standalone"]
  #   security_opt:
  #     - seccomp:unconfined
  #   environment:
  #     ETCD_ENDPOINTS: etcd:2379
  #     MINIO_ADDRESS: minio:9000
  #   volumes:
  #     - milvus-data:/var/lib/milvus
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
  #     interval: 30s
  #     start_period: 90s
  #     timeout: 20s
  #     retries: 3
  #   ports:
  #     - "19530:19530"
  #     - "9091:9091"
  #   depends_on:
  #     - etcd
  #     - minio
  #   restart: unless-stopped

  # =============================================================================
  # Core: Qdrant (Carto snippets, default, always starts)
  # Dedicated vector store for cartography snippets — keeps code embeddings
  # isolated from the general :memory-store so recall tuning is independent.
  # Used by :services :carto-store {:backend :qdrant-carto}.
  # =============================================================================
  qdrant-carto:
    image: qdrant/qdrant:latest
    container_name: hive-mcp-qdrant-carto
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - hive-qdrant-carto-data:/qdrant/storage
    restart: unless-stopped

  # =============================================================================
  # Core: NATS Server (default, always starts)
  # Push-based drone notifications
  # =============================================================================
  nats:
    image: nats:latest
    container_name: hive-mcp-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--http_port", "8222"]
    # No healthcheck: nats:latest is distroless (no /bin/sh, wget, or curl),
    # so in-container probes are impossible. TCP reachability on 4222/8222
    # and the HTTP monitor at http://localhost:8222/healthz are the source
    # of truth. Previously: ["CMD","wget","--spider","-q","http://localhost:8222/healthz"]
    # which failed with "wget: executable file not found" on every probe.
    restart: unless-stopped

  # =============================================================================
  # Optional: Observability Stack (profile: telemetry)
  # CLARITY-T: Telemetry first
  # =============================================================================
  prometheus:
    profiles: ["telemetry"]
    image: prom/prometheus:latest
    container_name: hive-mcp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    profiles: ["telemetry"]
    image: grafana/grafana:latest
    container_name: hive-mcp-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hivemcp
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    profiles: ["telemetry"]
    image: grafana/loki:2.9.0
    container_name: hive-mcp-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    profiles: ["telemetry"]
    image: grafana/promtail:2.9.0
    container_name: hive-mcp-promtail
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      - ${HOME}/.config/hive-mcp:/var/log/hive-mcp:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # Core (always created)
  chroma-data:
    driver: local
  hive-qdrant-carto-data:
    driver: local
  # lsp-cache: replaced with bind mount to ~/.cache/hive-lsp for host ↔ container sharing

  # Milvus (uncomment when profile enabled)
  # milvus-etcd:
  #   driver: local
  # milvus-minio:
  #   driver: local
  # milvus-data:
  #   driver: local

  # Telemetry (created when profile enabled)
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
